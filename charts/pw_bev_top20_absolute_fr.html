  <script>
    (function () {
      if (window.parent === window) {
        return;
      }

      var messageType = "chart-resize";
      var chartId = document.documentElement.getAttribute("data-chart-id") || "";
      var chartLang = document.documentElement.getAttribute("data-lang") || "";
      var lastHeight = 0;
      var timeoutId;

      function pageHeight() {
        var body = document.body;
        var html = document.documentElement;
        return Math.max(
          body ? body.scrollHeight : 0,
          body ? body.offsetHeight : 0,
          html.scrollHeight,
          html.offsetHeight,
          html.clientHeight
        );
      }

      function postHeight(reason) {
        var height = pageHeight();
        if (!height || Math.abs(height - lastHeight) < 1) {
          return;
        }
        lastHeight = height;
        window.parent.postMessage(
          {
            type: messageType,
            version: 1,
            chartId: chartId,
            lang: chartLang,
            height: height,
            reason: reason,
          },
          "*"
        );
      }

      function schedulePost(reason) {
        window.clearTimeout(timeoutId);
        timeoutId = window.setTimeout(function () {
          postHeight(reason);
        }, 140);
      }

      window.addEventListener("load", function () {
        postHeight("load");
      });

      window.addEventListener("resize", function () {
        schedulePost("resize");
      });

      document.addEventListener("DOMContentLoaded", function () {
        postHeight("dom-content-loaded");
        window.setTimeout(function () {
          postHeight("settle-300");
        }, 300);
        window.setTimeout(function () {
          postHeight("settle-1000");
        }, 1000);
      });

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          postHeight("fonts-ready");
        }).catch(function () {
          // Ignore font API failures and keep default events.
        });
      }

      if (window.MutationObserver) {
        var observer = new MutationObserver(function () {
          schedulePost("mutation");
        });
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
      }
    })();
  </script>
  <script>
    (function () {
      var button = document.getElementById("download-chart-png");
      if (!button) {
        return;
      }

      function parsePixels(value) {
        var parsed = Number.parseFloat(value);
        return Number.isFinite(parsed) ? parsed : 0;
      }

      function wrapText(context, text, maxWidth) {
        var words = text.trim().split(/\s+/);
        var lines = [];
        var line = "";

        words.forEach(function (word) {
          var candidate = line ? line + " " + word : word;
          if (line && context.measureText(candidate).width > maxWidth) {
            lines.push(line);
            line = word;
          } else {
            line = candidate;
          }
        });

        if (line) {
          lines.push(line);
        }
        return lines;
      }

      function loadImage(source) {
        return new Promise(function (resolve, reject) {
          var image = new Image();
          image.onload = function () { resolve(image); };
          image.onerror = function () { reject(new Error("Could not load the chart image.")); };
          image.src = source;
        });
      }

      button.addEventListener("click", async function () {
        var page = document.querySelector(".page");
        var chart = document.querySelector(".plotly-graph-div");
        var plotly = window.Plotly;
        var originalLabel = button.textContent;

        if (!page || !chart || !plotly || typeof plotly.toImage !== "function") {
          window.alert("The chart is not ready to export. Please try again.");
          return;
        }

        button.disabled = true;
        button.textContent = document.documentElement.lang === "fr-CH"
          ? "Préparation du PNG…"
          : "PNG wird vorbereitet…";

        try {
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }

          var pageStyle = window.getComputedStyle(page);
          var scale = 2;
          var pageWidth = page.clientWidth;
          var paddingLeft = parsePixels(pageStyle.paddingLeft);
          var paddingRight = parsePixels(pageStyle.paddingRight);
          var paddingTop = parsePixels(pageStyle.paddingTop);
          var paddingBottom = parsePixels(pageStyle.paddingBottom);
          var contentWidth = pageWidth - paddingLeft - paddingRight;
          var graphWidth = chart.clientWidth;
          var graphHeight = chart.clientHeight;
          var chartImageSource = await plotly.toImage(chart, {
            format: "png",
            width: graphWidth,
            height: graphHeight,
            scale: scale
          });
          var chartImage = await loadImage(chartImageSource);
          var measureCanvas = document.createElement("canvas");
          var measureContext = measureCanvas.getContext("2d");
          if (!measureContext) {
            throw new Error("Could not create a canvas for the PNG export.");
          }

          var sections = [];
          var totalHeight = paddingTop;

          function addTextSection(element) {
            if (!element) {
              return;
            }

            var text = (element.innerText || element.textContent || "").trim();
            if (!text) {
              return;
            }

            var style = window.getComputedStyle(element);
            var fontSize = parsePixels(style.fontSize) || 14;
            var lineHeight = parsePixels(style.lineHeight) || fontSize * 1.3;
            var marginTop = parsePixels(style.marginTop);
            var marginBottom = parsePixels(style.marginBottom);
            measureContext.font = style.font;
            var lines = wrapText(measureContext, text, contentWidth);

            sections.push({
              type: "text",
              lines: lines,
              font: style.font,
              color: style.color,
              fontSize: fontSize,
              lineHeight: lineHeight,
              marginTop: marginTop,
              marginBottom: marginBottom
            });
            totalHeight += marginTop + lines.length * lineHeight + marginBottom;
          }

          addTextSection(page.querySelector("h1"));
          addTextSection(page.querySelector(".subtitle"));

          var chartWrap = page.querySelector(".chart-wrap");
          var chartRect = chart.getBoundingClientRect();
          var pageRect = page.getBoundingClientRect();
          var chartX = chartRect.left - pageRect.left;
          var chartMarginTop = chartWrap
            ? parsePixels(window.getComputedStyle(chartWrap).marginTop)
            : 0;
          sections.push({
            type: "chart",
            image: chartImage,
            x: chartX,
            width: graphWidth,
            height: graphHeight,
            marginTop: chartMarginTop
          });
          totalHeight += chartMarginTop + graphHeight;

          Array.prototype.forEach.call(page.children, function (element) {
            if (element.matches(".export-controls, h1, .subtitle, .chart-wrap, .source, .note")) {
              return;
            }
            addTextSection(element);
          });
          addTextSection(page.querySelector(".note"));
          addTextSection(page.querySelector(".source"));
          totalHeight += paddingBottom;

          var canvas = document.createElement("canvas");
          canvas.width = Math.ceil(pageWidth * scale);
          canvas.height = Math.ceil(totalHeight * scale);
          var context = canvas.getContext("2d");
          if (!context) {
            throw new Error("Could not create a canvas for the PNG export.");
          }

          context.scale(scale, scale);
          context.fillStyle = window.getComputedStyle(document.body).backgroundColor || "#ffffff";
          context.fillRect(0, 0, pageWidth, totalHeight);
          var y = paddingTop;

          sections.forEach(function (section) {
            if (section.type === "chart") {
              y += section.marginTop;
              context.drawImage(section.image, section.x, y, section.width, section.height);
              y += section.height;
              return;
            }

            y += section.marginTop;
            context.font = section.font;
            context.fillStyle = section.color;
            section.lines.forEach(function (line, index) {
              context.fillText(
                line,
                paddingLeft,
                y + section.fontSize + index * section.lineHeight
              );
            });
            y += section.lines.length * section.lineHeight + section.marginBottom;
          });

          var download = document.createElement("a");
          var chartId = document.documentElement.getAttribute("data-chart-id") || "chart";
          download.download = chartId + ".png";
          download.href = canvas.toDataURL("image/png");
          download.click();
        } catch (error) {
          window.alert(
            (document.documentElement.lang === "fr-CH"
              ? "Échec de la création du PNG : "
              : "PNG konnte nicht erstellt werden: ") + error.message
          );
        } finally {
          button.disabled = false;
          button.textContent = originalLabel;
        }
      });
    })();
